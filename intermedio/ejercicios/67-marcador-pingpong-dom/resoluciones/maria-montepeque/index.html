<!doctype html>
<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marcador pingpong</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="marcador-container">
    <h1>Marcador de pingpong</h1>
    <p id="marcador-actual">0 - 0</p>
    <p id="sets-info">Sets: 0 - 0</p>

      <button id="boton-punto-b">Punto B</button>
      <button id="boton-reset-marcador">Reiniciar</button>
    </div>
  </main>
  <script src="maria-montepeque.js"></script>

</html>
