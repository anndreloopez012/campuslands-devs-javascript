<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playlist interactiva</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="reproductor">
    <h1 id="reproductor-titulo">Cargando...</h1>
    <p id="reproductor-artista"></p>
    <p id="reproductor-favorito">Favorito: no</p>
    <div class="botones">
      <button id="boton-anterior">Anterior</button>
      <button id="boton-siguiente">Siguiente</button>
      <button id="boton-shuffle">Shuffle</button>
      <button id="boton-favorito">❤ Favorito</button>
    </div>
  </main>
  <script src="maria-montepeque.js"></script>
</body>
</html>
